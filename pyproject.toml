[project]
name = "orbitrows"
version = "0.1.0"
description = "Reconcile a store CSV export with an incoming update CSV, using Jev plus deterministic matching, driven from the command line."
readme = "README.md"
authors = [
    { name = "aminesayagh", email = "aminesayagh1997@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "babel>=2.18.0",
    "charset-normalizer>=3.5.1",
    "en-core-web-sm",
    "fr-core-news-sm",
    "gliner2[local]>=2.0.0",
    "lark==1.3.1",
    "python-dateutil==3.0.0",
    "numpy>=2.5.3",
    "pint>=0.26.1",
    "pydantic>=2.13.5",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=5.7.0",
    "spacy==3.8.16",
    "sqlglot==30.21.0",
    "text2num==3.1.0",
    "torch>=2.14.0",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
orbitrows = "orbitrows.services.cli.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# Code lives directly in src/ but is imported as `orbitrows`.
[tool.setuptools.package-dir]
orbitrows = "src"

# The operations catalog ships with the code: its single source, opened read-only (pipeline/operations/catalog.py).
[tool.setuptools.package-data]
"orbitrows.pipeline.operations" = ["operations.db"]
# The number reader's grammar (units/quantity_parser, moved in from ../text_to_number on 2026-10-27).
"orbitrows.units.quantity_parser" = ["grammar.lark"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["catalog: the operations' search, with the search model loaded (pytest -m catalog)"]
addopts = "-m 'not catalog'"

# CPU-only PyTorch for GLiNER2 (the build the header benchmark measured); much smaller than the CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
