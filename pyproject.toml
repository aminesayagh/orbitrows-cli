[project]
name = "orbitrows"
version = "0.1.0"
description = "Reconcile a store CSV export with an incoming update CSV, using Jev plus deterministic matching, with human review in a Textual TUI."
readme = "README.md"
authors = [
    { name = "aminesayagh", email = "aminesayagh1997@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "babel>=2.18.0",
    "gliner2[local]>=2.0.0",
    "pint>=0.26.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.1",
    "textual>=8.2.8",
    "textual-autocomplete>=4.0.6",
    "torch>=2.14.0",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
orbitrows = "orbitrows.services.cli.app:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# Code lives directly in src/ but is imported as `orbitrows`.
[tool.setuptools.package-dir]
orbitrows = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# CPU-only PyTorch for GLiNER2 (the build the header benchmark measured); much smaller than the CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
